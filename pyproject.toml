[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "segui-bus"
description = "Proximity alerts for SETA Piacenza buses (seta-pc namespace)"
readme = "README.md"
requires-python = ">=3.12"
# The version is NOT written here: it is read from the VERSION file, which is
# the single source of truth (see docs/versioning.md).
dynamic = ["version"]
dependencies = [
    "gtfs-realtime-bindings>=1.0.0",
    "httpx>=0.27",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = '(?P<version>\d+\.\d+\.\d+.*)'

[tool.hatch.build.targets.wheel]
packages = ["src/segui_bus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Collect both TestSomething and SomethingTest, so MultiBusTest is picked up.
python_classes = ["Test*", "*Test"]

[tool.ruff]
line-length = 100
target-version = "py312"
